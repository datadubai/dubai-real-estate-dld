# Weekly mirror: the dataset is published to Hugging Face from the datadubai.ae nightly build
# (Sunday night), and this job copies the same files here. No secrets needed: Hugging Face
# is read anonymously, and the push uses the job's own token limited to this repository.
name: Mirror from Hugging Face
on:
  schedule:
    - cron: "30 6 * * 1"   # Monday 06:30 UTC, after the Sunday publish
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from Hugging Face
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('datadubai/dubai-real-estate-dld', repo_type='dataset', local_dir='_hf')"
          rm -rf _hf/.cache _hf/.gitattributes
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _hf -exec rm -rf {} +
          cp -r _hf/. . && rm -rf _hf
      - name: Commit if changed
        run: |
          git config user.name "Dubai Data"
          git config user.email "data@datadubai.ae"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          THROUGH=$(grep -o 'Data through:\*\* [0-9-]*' README.md | grep -o '[0-9-]*$' || true)
          git commit -m "Mirror from Hugging Face: data through ${THROUGH:-unknown}"
          git push
